name: Security Header Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd omarg-ui
          npm ci
      - name: Run Isomorphism & Privacy Header Test Suite
        run: |
          cd omarg-ui
          npm run test
